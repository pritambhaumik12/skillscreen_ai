<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - SkillScreen AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .dashboard { padding: 4rem 5%; }
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3rem; }
    </style>
</head>
<body>
    <nav class="navbar glass">
        <a href="/" style="text-decoration:none;"><div class="logo">SkillScreen <span>AI</span></div></a>
        <div class="nav-links">
            <span style="color:#94a3b8;">Candidate Mode</span>
            <a href="/profile" class="nav-link">Profile</a>
            <a href="/api/v1/auth/logout" class="nav-link">Logout</a>
        </div>
    </nav>
    <div class="dashboard fade-in-up">
        <div class="dashboard-header">
            <h2>Your Dashboard</h2>
            <div style="display:flex; gap:1rem; align-items:center;">
                <a href="/api/v1/interview/precheck/demo-session-123" class="btn btn-primary" style="padding: 0.8rem 1.5rem;"><svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="margin-right: 0.5rem;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> Join Demo Interview</a>
            </div>
        </div>
        <div class="cards-grid">
            <div class="card glass interactive">
                <h3>0</h3>
                <p>Interviews Completed</p>
            </div>

            <div class="card glass interactive">
                <h3>0</h3>
                <p>Open Invitations</p>
            </div>
        </div>
    </div>
</body>
</html>
